<!DOCTYPE html>
<html>
<head>
    <title>Automatic Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>Automatic Flashcards</h1>
        <p class="subtitle">Generate flashcards from the current page.</p>

        <div class="settings">
            <label for="language-select">Language:</label>
            <select id="language-select">
                <option value="en">English</option>
                <option value="pt">Portuguese</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>
        </div>

        <button id="generate-button">Generate Flashcards</button>
        <div id="flashcards-container"></div>
    </div>
    <footer class="attribution">
        <p>Powered by <a href="https://freedictionaryapi.com/" target="_blank">FreeDictionaryAPI.com</a></p>
    </footer>
    <script src="popup.js"></script>
</body>
</html>
